plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'

    id 'checkstyle'
    id 'pmd'
    id 'jacoco'

    id 'com.github.spotbugs' version '6.5.10'
    id 'org.sonarqube' version '7.4.0.8496'

    id 'com.diffplug.spotless' version '8.9.0'
}

checkstyle {
    toolVersion = '10.15.0'
    config = resources.text.fromArchiveEntry(
            configurations.checkstyle.filter { it.name.startsWith("checkstyle-") },
            'google_checks.xml'
    )
    ignoreFailures = false
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.21.0')
        removeUnusedImports()
    }
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}

test {
    finalizedBy jacocoTestReport
}

sonar {
    properties {
        property "sonar.projectKey", "yaaanni_logix-core-spring-boot-starter"
        property "sonar.organization", "yaaanni"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
    }
}

tasks.named('sonar') {
    dependsOn test, jacocoTestReport
}

group = 'io.github.yaaanni'
version = '0.0.1-SNAPSHOT'
description = 'logix-core-spring-boot-starter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-opentelemetry'

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    runtimeOnly 'io.micrometer:micrometer-registry-otlp'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/yaaanni/logix-core-spring-boot-starter")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

tasks.register('installGitHooks', Exec) {
    commandLine 'sh', '-c', 'chmod +x .githooks/pre-commit 2>/dev/null || true; git config core.hooksPath .githooks'
}

tasks.named('compileJava') {
    dependsOn 'installGitHooks'
}
